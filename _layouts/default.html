<!--
    _layouts/default.html
    =====================================================================
    The "frame" shared by every page on the site. Jekyll (the tool GitHub
    Pages uses to build the site) takes a page such as index.html and
    inserts it where {{ content }} appears below.

    Anything inside {{ ... }} or {% ... %} is Liquid, Jekyll's template
    language. It is replaced with real HTML when the site is built.
-->
<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Basic page settings: text encoding and proper scaling on phones -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Short summary that search engines (e.g. Google) may show under the link -->
        <meta name="description" content="Personal website of Yurii Potsiluienko, an Electrical Engineering student.">

        <!-- Text shown in the browser tab. Comes from "title:" at the top of each page -->
        <title>{{ page.title }}</title>

        <!-- Pick light/dark mode before the page is drawn (prevents a white flash).
             This must stay in <head>; see the comments inside the file for why. -->
        <script src="/static/js/theme-init.js"></script>

        <!-- Small icon shown in the browser tab -->
        <link rel="icon" href="/static/img/YP_favicon.png" sizes="16x16" type="image/png">

        <!-- Bootstrap: a ready-made CSS library that provides the layout grid,
             buttons, cards, navbar, colours, etc. Loaded from a CDN (an external server). -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

        <!-- Bootstrap Icons: lets us show icons with tags like <i class="bi bi-github"></i> -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">

        <!-- Our own styles. Loaded last so they can override Bootstrap's -->
        <link rel="stylesheet" href="/static/css/styles.css">
    </head>
    <body>

        <!-- Navbar: the menu bar at the top (_includes/navbar.html) -->
        {% include navbar.html %}

        <!-- The page's own content is inserted here (e.g. everything in index.html) -->
        {{ content }}
        
        <!-- Footer: the bar at the bottom (_includes/footer.html) -->
        {% include footer.html %}

        <!-- Scripts are loaded at the end so the page shows up before they download -->
        <!-- Our own JavaScript: footer year + theme toggle button -->
        <script src="/static/js/main.js"></script>
        <!-- Bootstrap's JavaScript: makes the navbar's mobile menu button open/close -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    </body>
</html>
