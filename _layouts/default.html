<!--
    default.html - the layout every page uses.
    jekyll puts the page (index.html) where the "content" tag is in the body.
    the curly brace tags = liquid (jekyll's template stuff), gets replaced when the site builds.
    NOTE: don't write liquid tags inside these comments, jekyll still runs them and the build breaks
-->
<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- encoding + scale properly on phones -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- summary google can show under the link -->
        <meta name="description" content="Personal website of Yurii Potsiluienko, an Electrical Engineering student.">

        <!-- browser tab text, comes from title: at the top of the page -->
        <title>{{ page.title }}</title>

        <!-- sets light/dark before the page draws (no white flash). has to stay in <head>! -->
        <script src="/static/js/theme-init.js"></script>

        <!-- tab icon -->
        <link rel="icon" href="/static/img/YP_favicon.png" sizes="16x16" type="image/png">

        <!-- bootstrap CSS (grid, buttons, cards, navbar, colours...) from a CDN -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

        <!-- bootstrap icons, used like <i class="bi bi-github"></i> -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">

        <!-- my styles. last so they override bootstrap -->
        <link rel="stylesheet" href="/static/css/styles.css">
    </head>
    <body>

        <!-- navbar (_includes/navbar.html) -->
        {% include navbar.html %}

        <!-- page content goes here -->
        {{ content }}
        
        <!-- footer (_includes/footer.html) -->
        {% include footer.html %}

        <!-- scripts at the end so the page shows up first -->
        <!-- my JS: footer year + theme button -->
        <script src="/static/js/main.js"></script>
        <!-- bootstrap JS: needed for the mobile menu button to open/close -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    </body>
</html>
