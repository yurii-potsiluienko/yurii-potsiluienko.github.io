<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />
  <link rel="stylesheet" href="{{ '/_static/css/style.css' | relative_url }}" />
  <script src="{{ '/_static/js/theme.js' | relative_url }}"></script>

  <!-- Favicon links -->
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/_static/img/favicon/favicon-16x16.png' | relative_url }}" />
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/_static/img/favicon/favicon-32x32.png' | relative_url }}" />
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/_static/img/favicon/apple-touch-icon.png' | relative_url }}" />
</head>
<body>
  {% include header.html %}

  <main class="container py-4 py-md-5" style="max-width: 1000px;">
    {{ content }}
  </main>

  {% include footer.html %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
