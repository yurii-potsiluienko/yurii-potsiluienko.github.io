# _data/skills.yml
# -------------------------------------------------------------------
# The skill categories shown in the "Technical Skills" section.
# Each entry starting with "- category:" becomes one card on the page
# (drawn by _includes/skill_card.html).
#
#   category: card heading
#   icon:     Bootstrap icon name, find more at https://icons.getbootstrap.com
#   items:    list of skills shown as grey badges (one per "- " line)
#
# Indentation matters in YAML: keep the spaces lined up like the examples.

- category: "Hardware"
  icon: "bi-cpu"
  items:
    - "Arduino"
    - "Raspberry Pi"
    - "Circuit Analysis"
    - "Sensors & Actuators"
    - "PCB design"

- category: "Software"
  icon: "bi-code-slash"
  items:
    - "C / C++"
    - "Python"
    - "MATLAB"
    - "Simulink"
    - "HTML / CSS"
    - "Git / GitHub"

- category: "Lab & design tools"
  icon: "bi-tools"
  items:
    - "KiCad"
    - "LTspice"
    - "Oscilloscope"
    - "Digital multimeter"
    - "Function generator"
    - "Soldering"