about_paragraphs:
  - >
    I am an electrical engineering student building hands-on hardware and
    embedded systems projects. My coursework and lab work center on analog and
    power circuits, microcontroller peripherals, and board-level testing.
  - >
    Before ordering boards, I simulate topologies and transient behavior in
    LTspice, lay out schematics and PCBs in KiCad, and verify prototypes with
    oscilloscopes, logic analyzers, and structured firmware tests.