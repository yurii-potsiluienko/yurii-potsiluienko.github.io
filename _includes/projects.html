<!--
    _includes/projects.html
    The "Projects" section: a grid of project cards.
    To add, remove, or edit a project, change _data/projects.yml, not this file.
-->

<!-- id="projects" lets the navbar's "Projects" link scroll here; py-5 = padding above/below -->
<section id="projects" class="py-5">
    <div class="container">
        <h2 class="mb-5 text-center">Projects</h2>
        <!-- The grid. Number of cards per row depends on screen width:
               row-cols-1    = 1 per row on phones
               row-cols-md-2 = 2 per row on tablets
               row-cols-lg-3 = 3 per row on laptops/desktops
             g-4 = gap between cards -->
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            <!-- Loop over every project in _data/projects.yml and draw a card for it
                 using _includes/project_card.html -->
            {% for project in site.data.projects %}
            {% include project_card.html project=project %}
            {% endfor %}

            <!-- Extra "More to come..." card that always appears last.
                 The dashed border comes from ".border-dashed" in static/css/styles.css. -->
            <div class="col">
                <div class="card h-100 shadow-sm border-dashed">
                    <div class="card-body d-flex flex-column align-items-center justify-content-center text-center text-muted">
                        <i class="bi bi-tools fs-1 mb-2"></i>
                        <h5 class="card-title">More to come...</h5>
                        <p class="card-text">Exciting new projects are currently in the works!</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
