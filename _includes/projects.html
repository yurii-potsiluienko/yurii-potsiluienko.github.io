<section id="projects" class="py-5 border-bottom">
  <div class="d-flex flex-column flex-sm-row justify-content-sm-between align-items-sm-baseline gap-1 mb-4">
    <h2 class="h4 fw-semibold mb-0">Projects</h2>
  </div>

  <div class="row g-4">
    {% assign sorted_projects = site.projects | sort: "order" %}
    {% for project in sorted_projects %}
      {% include project-card.html project=project %}
    {% endfor %}
  </div>
</section>
