<!--
    navbar at the top. on phones the links turn into the hamburger button,
    bootstrap's JS (loaded in default.html) does the open/close
-->

<!-- navbar-expand-lg = full menu on big screens, hamburger on small ones -->
<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <!-- container-fluid = full width -->
    <div class="container-fluid">
        <!-- logo -->
        <a class="navbar-brand" href="#">
            <img src="/static/img/YP_logo.png" alt="YP" class="logo" height="32" width="32"> 
        </a>

        <!-- hamburger button (small screens only). data-bs-target = what it opens -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- the links (this is what the hamburger shows/hides) -->
        <div class="collapse navbar-collapse" id="navbarNav">
            <!-- ms-auto = push links to the right -->
            <ul class="navbar-nav ms-auto">
                <!-- /#about = home page, scroll to id="about" -->
                <li class="nav-item">
                    <a class="nav-link" href="/#about">About Me</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/#skills">Skills</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/#projects">Projects</a>
                </li>
                <!-- resume link (in external_links.yml) -->
                <li class="nav-item">
                    <a href="{{ site.data.external_links.resume_portfolio_view_link }}" target="_blank" class="nav-link">Resume & Portfolio</a>
                </li>
                <!-- light/dark button, the click code is in main.js (also swaps moon/sun) -->
                <li class="nav-item">
                    <button id="theme-toggle" class="btn btn-sm btn-outline-secondary ms-2">
                        <i id="theme-icon" class="bi bi-moon"></i>
                    </button>
                </li>
            </ul>
        </div>
    </div>
</nav>
