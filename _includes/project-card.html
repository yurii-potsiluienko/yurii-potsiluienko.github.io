<div class="col-md-6 col-lg-4">
  <article class="card project-card h-100">
    {% if project.image %}
      <img
        src="{{ project.image | relative_url }}"
        alt="{{ project.title }}"
        class="card-img-top object-fit-cover"
        style="aspect-ratio: 16 / 10;"
      />
    {% endif %}

    <div class="card-body d-flex flex-column p-4">
      {% if project.subtitle %}
        <div class="mono text-body-secondary small mb-1">{{ project.subtitle }}</div>
      {% endif %}
      <h3 class="h6 fw-semibold mb-2">{{ project.title }}</h3>
      <p class="card-text text-body-secondary small mb-3">
        {{ project.summary }}
      </p>

      {% if project.skills %}
        <div class="d-flex flex-wrap gap-1 mt-auto pt-2">
          {% for skill in project.skills %}
            <span class="skill-badge">{{ skill }}</span>
          {% endfor %}
        </div>
      {% endif %}
    </div>

    <div class="card-footer bg-transparent border-top px-4 py-3 d-flex justify-content-between align-items-center small">
      <a class="text-body text-decoration-none fw-medium" href="{{ project.url | relative_url }}">
        Read More
      </a>
      {% if project.repo_url %}
        <a
          class="text-primary text-decoration-none fw-medium"
          href="{{ project.repo_url }}"
          target="_blank"
          rel="noopener noreferrer"
        >
          GitHub Repo ↗
        </a>
      {% endif %}
    </div>
  </article>
</div>
