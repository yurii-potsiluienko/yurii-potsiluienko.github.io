<!--
    skills section, one card per category
    edit _data/skills.yml to change skills
-->
<section id="skills" class="py-5">
    <div class="container">
        <h2 class="mb-5 text-center">Technical Skills</h2>
        <!-- row = bootstrap grid row, g-4 = gap -->
        <div class="row g-4 text-center">
            <!-- one card per category (layout in skill_card.html) -->
            {% for skill in site.data.skills %}
            {% include skill_card.html skill=skill %}
            {% endfor %}
        </div>
    </div>
</section>
