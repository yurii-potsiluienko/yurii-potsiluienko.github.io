<!--
    _includes/skills.html
    The "Technical Skills" section: one card per skill category.
    To change the skills, edit _data/skills.yml, not this file.
-->
<section id="skills" class="py-5">
    <div class="container">
        <h2 class="mb-5 text-center">Technical Skills</h2>
        <!-- "row" starts a Bootstrap grid row; g-4 = gap between cards -->
        <div class="row g-4 text-center">
            <!-- Loop over every category in _data/skills.yml and draw a card
                 for it using _includes/skill_card.html -->
            {% for skill in site.data.skills %}
            {% include skill_card.html skill=skill %}
            {% endfor %}
        </div>
    </div>
</section>
