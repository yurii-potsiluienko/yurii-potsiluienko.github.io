<section id="skills" class="py-5 border-bottom">
  <div class="d-flex flex-column flex-sm-row justify-content-sm-between align-items-sm-baseline gap-1 mb-4">
    <h2 class="h4 fw-semibold mb-0">Skills</h2>
  </div>

  <div class="row g-3">
    {% for group in site.data.skills %}
      <div class="col-md-4">
        <div class="surface-card card p-4 h-100">
          <h3 class="h6 fw-semibold mb-3">{{ group.emoji }} {{ group.category }}</h3>
          <ul class="list-unstyled text-body-secondary small mb-0 vstack gap-2">
            {% for item in group.items %}
              <li>• {{ item }}</li>
            {% endfor %}
          </ul>
        </div>
      </div>
    {% endfor %}
  </div>
</section>
