<header class="sticky-top">
  <nav class="navbar navbar-expand-md py-2 bg-body-tertiary">
    <div class="container" style="max-width: 1000px;">
      <a class="navbar-brand fw-semibold" href="{{ '/' | relative_url }}">
        {{ site.data.profile.name | default: site.title }}
      </a>

      <div class="d-flex align-items-center gap-2 order-md-last">
        <button
          id="themeToggleBtn"
          class="btn btn-outline-secondary border-0 p-2 text-body"
          type="button"
          aria-label="Switch to dark mode"
          title="Switch to dark mode"
        >
          <i id="themeToggleIcon" class="bi bi-moon-stars-fill"></i>
        </button>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNavbar"
          aria-controls="mainNavbar"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
      </div>

      <div class="collapse navbar-collapse justify-content-end" id="mainNavbar">
        <ul class="navbar-nav gap-md-3 align-items-md-center pt-2 pt-md-0">
          <li class="nav-item">
            <a class="nav-link" href="{{ '/#about' | relative_url }}">About</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ '/#skills' | relative_url }}">Skills</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ '/#projects' | relative_url }}">Projects</a>
          </li>
          {% if site.resume_url %}
            <li class="nav-item">
              <a
                class="nav-link fw-medium text-primary"
                href="{{ site.resume_url }}"
                target="_blank"
                rel="noopener noreferrer"
              >
                Resume ↗
              </a>
            </li>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>
</header>
