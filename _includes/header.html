<!--
    top of the page: photo, name, tagline, social links
-->

<!-- text-center = centre everything, my-4 = margin top/bottom -->
<header class="text-center my-4">
    <!-- my photo. round shape + border = .profile-pic in styles.css
         alt = for screen readers / if the image doesn't load
         width/height = saves the space so the page doesn't jump while loading
         fetchpriority="high" = load this image first -->
    <img src="/static/img/YP_professional_photo.jpg" 
        alt="{{ site.data.about_me.name }}" 
        class="profile-pic"
        width="150"
        height="150"
        fetchpriority="high">
            
    <!-- name from about_me.yml -->
    <h1>{{ site.data.about_me.name }}</h1>
    <p>Electrical Engineering Student | Portfolio</p>
            
    <!-- same social links as the footer (urls in external_links.yml) -->
    <div class="social-links-container">
        <a href="{{ site.data.external_links.github }}" target="_blank" class="github">
            <i class="bi bi-github"></i>
        </a>
        <a href="{{ site.data.external_links.linkedin }}" target="_blank" class="linkedin">
            <i class="bi bi-linkedin"></i>
        </a>
        <a href="{{ site.data.external_links.email }}" class="email" title="Email">
            <i class="bi bi-envelope"></i>
        </a>
    </div>
</header>
