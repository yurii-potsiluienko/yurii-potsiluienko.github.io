<!--
    footer: social links + copyright
-->

<!-- bg-body-tertiary = grey bg (works in dark mode too)
     py-4 = padding top/bottom, mt-5 = space above, border-top = line on top -->
<footer class="bg-body-tertiary py-4 mt-5 border-top">
  <div class="container text-center">
    <!-- social links. urls are in _data/external_links.yml, colours/hover in styles.css -->
     <div class="social-links-container">
        <!-- target="_blank" = open in new tab -->
        <a href="{{ site.data.external_links.github }}" target="_blank" class="github">
            <i class="bi bi-github"></i>
        </a>
        <a href="{{ site.data.external_links.linkedin }}" target="_blank" class="linkedin">
            <i class="bi bi-linkedin"></i>
        </a>
        <!-- mailto: opens the email app -->
        <a href="{{ site.data.external_links.email }}" class="email" title="Email">
            <i class="bi bi-envelope"></i>
        </a>
    </div>

    <!-- main.js fills in the year in the empty span -->
    <p class="text-muted mb-0">
      © <span id="current-year"></span> Yurii Potsiluienko. All rights reserved.
    </p>
  </div>
</footer>
