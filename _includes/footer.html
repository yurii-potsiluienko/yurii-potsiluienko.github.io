<footer class="border-top py-4 mt-4 text-body-secondary small">
  <div class="container d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2" style="max-width: 1000px;">
    <span>{{ site.data.profile.name | default: site.title }}</span>

    <div class="d-flex flex-wrap gap-3">
      {% if site.resume_url %}
        <a
          class="text-body-secondary text-decoration-none"
          href="{{ site.resume_url }}"
          target="_blank"
          rel="noopener noreferrer"
        >
          Resume
        </a>
      {% endif %}

      {% if site.linkedin_url %}
        <a
          class="text-body-secondary text-decoration-none"
          href="{{ site.linkedin_url }}"
          target="_blank"
          rel="noopener noreferrer"
        >
          LinkedIn
        </a>
      {% endif %}

      {% if site.github_url %}
        <a
          class="text-body-secondary text-decoration-none"
          href="{{ site.github_url }}"
          target="_blank"
          rel="noopener noreferrer"
        >
          GitHub
        </a>
      {% endif %}

      {% if site.email_address %}
        <a
          class="text-body-secondary text-decoration-none"
          href="mailto:{{ site.email_address }}"
        >
          Email
        </a>
      {% endif %}
    </div>
  </div>
</footer>
